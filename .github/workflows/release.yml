name: Release

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Compute version & create release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.versioning.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: versioning
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)

          # First release starts at v1.0.0; later ones bump patch, rolling
          # over at .9 into minor and at .9 into major (v1.0.8 -> v1.0.9 ->
          # v1.1.0 -> ... -> v1.9.9 -> v2.0.0).
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            PATCH=$((PATCH + 1))
            if [ "$PATCH" -gt 9 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi
            if [ "$MINOR" -gt 9 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi

            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          fi

          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.new_tag }}
          name: "Rex ${{ steps.versioning.outputs.new_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    permissions:
      actions: read
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
          - platform: windows-latest
            args: ""
            rust-target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Stamp the release version into the app manifests
        shell: bash
        env:
          NEW_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          VER="${NEW_TAG#v}"
          sed -i.bak "s/^  \"version\": \".*\"/  \"version\": \"$VER\"/" src-tauri/tauri.conf.json
          sed -i.bak 's/^version = ".*"/version = "'"$VER"'"/' src-tauri/Cargo.toml
          rm -f src-tauri/tauri.conf.json.bak src-tauri/Cargo.toml.bak
          echo "App version set to $VER"
          grep -n '"version"' src-tauri/tauri.conf.json | head -n1

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Apple API key to disk
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REX_CLI_TARGET: ${{ matrix.rust-target }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ needs.version.outputs.new_tag }}
          releaseName: "Rex ${{ needs.version.outputs.new_tag }}"
          releaseBody: "See the assets to download and install. Auto-update is built in."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The re-signed AppImage and
      # its .sig are re-uploaded here; the updater manifest is patched in the
      # patch-updater-manifest job after all matrix legs finish, so a parallel
      # macOS/Windows upload cannot clobber the combined latest.json.
      - name: Fix AppImage wayland libs and re-sign
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          test -x squashfs-root/usr/bin/rex \
            || { echo "rex binary missing from AppImage"; exit 1; }

          # linuxdeploy may already exclude some of these libraries.
          find squashfs-root \( -type f -o -type l \) \
            -name 'libwayland-*.so*' -print -delete

          curl -fsSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

          # Sanity-check the repacked image before it replaces the original.
          rm -rf squashfs-root
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null
          if find squashfs-root -name 'libwayland-*.so*' -print -quit | grep -q .; then
            echo "Wayland library still present after repack"
            exit 1
          fi
          test -x squashfs-root/usr/bin/rex \
            || { echo "rex binary missing from repacked AppImage"; exit 1; }
          popd >/dev/null

          cp "$WORK/$BASENAME" "$APPIMAGE"

          rm -f "$APPIMAGE.sig"
          pnpm tauri signer sign "$APPIMAGE"

          TAG="${{ needs.version.outputs.new_tag }}"
          gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sig" \
            --clobber --repo "$GITHUB_REPOSITORY"

  # Patch the re-signed AppImage signatures into the
  # combined updater manifest. Runs once, after every matrix leg has finished
  # merging its platform into latest.json, so it operates on the full manifest
  # and cannot be clobbered by a parallel upload. Both linux keys point at the
  # AppImage; the three windows keys point at the installers tauri-action
  # produced and signed with TAURI_SIGNING_PRIVATE_KEY.
  patch-updater-manifest:
    name: Patch updater manifest
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Patch latest.json with re-signed AppImage and Windows signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.new_tag }}"

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" \
            --pattern "*_amd64.AppImage.sig" \
            --pattern "*_x64-setup.exe.sig" \
            --pattern "*_x64_en-US.msi.sig" --clobber

          APP_SIG=$(cat ./*_amd64.AppImage.sig)
          EXE_SIG=$(cat ./*_x64-setup.exe.sig)
          MSI_SIG=$(cat ./*_x64_en-US.msi.sig)

          # Re-signing an artifact re-uploads it with --clobber, which deletes
          # and recreates the asset under a new id. tauri-action baked the old
          # asset-id API urls into latest.json, so we also rewrite the urls of
          # the re-signed artifacts to the tag+filename download url, which is
          # stable across clobbers. Filenames come from the .sig names.
          APP_FILE=$(basename "$(ls ./*_amd64.AppImage.sig)" .sig)
          EXE_FILE=$(basename "$(ls ./*_x64-setup.exe.sig)" .sig)
          MSI_FILE=$(basename "$(ls ./*_x64_en-US.msi.sig)" .sig)
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          jq -e 'has("platforms") and (.platforms | has("linux-x86_64")
            and has("windows-x86_64") and has("windows-x86_64-msi")
            and has("windows-x86_64-nsis"))' latest.json >/dev/null \
            || { echo "latest.json missing an expected platform key"; exit 1; }

          # The generic windows-x86_64 key mirrors whichever installer Tauri
          # picked as primary; decode its current signature to see which file it
          # references so the correct signature and url are used.
          GEN_FILE=$(jq -r '.platforms["windows-x86_64"].signature' latest.json \
            | base64 -d | grep -oE 'file:[^[:space:]]+' | head -n1)
          GEN_FILE=${GEN_FILE#file:}
          case "$GEN_FILE" in
            *.msi) WIN_GEN="$MSI_SIG" ;;
            *)     WIN_GEN="$EXE_SIG" ;;
          esac

          jq --arg app "$APP_SIG" --arg gen "$WIN_GEN" \
             --arg msi "$MSI_SIG" --arg nsis "$EXE_SIG" \
             --arg appurl "$DL/$APP_FILE" --arg genurl "$DL/$GEN_FILE" \
             --arg msiurl "$DL/$MSI_FILE" --arg exeurl "$DL/$EXE_FILE" '
            .platforms["linux-x86_64"] += {signature: $app, url: $appurl}
            | (if .platforms["linux-x86_64-appimage"]
               then .platforms["linux-x86_64-appimage"] += {signature: $app, url: $appurl}
               else . end)
            | .platforms["windows-x86_64"] += {signature: $gen, url: $genurl}
            | .platforms["windows-x86_64-msi"] += {signature: $msi, url: $msiurl}
            | .platforms["windows-x86_64-nsis"] += {signature: $nsis, url: $exeurl}
          ' latest.json > latest.json.tmp
          mv latest.json.tmp latest.json

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
