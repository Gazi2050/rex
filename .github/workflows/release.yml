name: Release

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Compute version & create release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.versioning.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: versioning
        run: |
          LATEST_TAG=$(git tag --sort=-v:refname | head -n 1)

          # First release starts at v1.0.0; later ones bump patch, rolling
          # over at .9 into minor and at .9 into major (v1.0.9 -> v1.1.0).
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            VERSION=${LATEST_TAG#v}
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            PATCH=$((PATCH + 1))
            if [ "$PATCH" -gt 9 ]; then
              PATCH=0
              MINOR=$((MINOR + 1))
            fi
            if [ "$MINOR" -gt 9 ]; then
              MINOR=0
              MAJOR=$((MAJOR + 1))
            fi

            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          fi

          echo "New tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.new_tag }}
          name: "Rex ${{ steps.versioning.outputs.new_tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: "--bundles deb"
            rust-target: ""
          - platform: windows-latest
            args: "--bundles nsis"
            rust-target: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            rust-target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Stamp the release version into the app manifests
        shell: bash
        env:
          NEW_TAG: ${{ needs.version.outputs.new_tag }}
        run: |
          VER="${NEW_TAG#v}"
          sed -i.bak "s/^  \"version\": \".*\"/  \"version\": \"$VER\"/" src-tauri/tauri.conf.json
          sed -i.bak 's/^version = ".*"/version = "'"$VER"'"/' src-tauri/Cargo.toml
          rm -f src-tauri/tauri.conf.json.bak src-tauri/Cargo.toml.bak
          echo "App version set to $VER"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REX_CLI_TARGET: ${{ matrix.rust-target }}
        with:
          tagName: ${{ needs.version.outputs.new_tag }}
          releaseName: "Rex ${{ needs.version.outputs.new_tag }}"
          releaseBody: "See the assets to download and install."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Tauri slugs the product name with dots (Rex.Terminal_1.0.1_amd64.deb).
  # Normalize every asset to underscores (Rex_Terminal_1.0.1_amd64.deb)
  # so download names and the in-app update command agree.
  rename-assets:
    name: Normalize asset names
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rename Rex.Terminal_* assets to Rex_Terminal_*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.version.outputs.new_tag }}"

          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            case "$name" in
              Rex.Terminal_*)
                NEW_NAME="Rex_Terminal_${name#Rex.Terminal_}"
                gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" \
                  -f name="$NEW_NAME" --jq '.name'
                ;;
            esac
          done
